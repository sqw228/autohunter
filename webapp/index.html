<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AutoHunter</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
 --bg:#050607;--card:rgba(15,17,19,.94);--card2:#111417;
 --text:#f7f7f7;--hint:#8d949b;--accent:#ff6a00;--accent2:#ff8a00;--good:#6fdc3d;
 --border:rgba(255,106,0,.16);--soft-border:rgba(255,255,255,.07);
}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;padding:18px 14px 100px;background:
 radial-gradient(circle at 50% -12%,rgba(255,106,0,.16),transparent 34%),
 radial-gradient(circle at 100% 30%,rgba(255,106,0,.055),transparent 32%),
 #050607;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;min-height:100vh}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.012),transparent 35%);z-index:-1}
header{padding:8px 4px 18px}h1{margin:0;font-size:30px;letter-spacing:-1px;font-weight:850}
h1:first-letter{filter:drop-shadow(0 0 8px rgba(255,106,0,.45))}
.sub{color:var(--hint);margin-top:5px;font-size:13px}
.card{background:linear-gradient(145deg,rgba(18,20,22,.97),rgba(9,11,12,.97));border:1px solid var(--soft-border);border-radius:20px;padding:15px;margin-bottom:12px;box-shadow:0 12px 34px rgba(0,0,0,.34);backdrop-filter:blur(16px)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{background:linear-gradient(145deg,rgba(255,106,0,.08),rgba(255,255,255,.025));border:1px solid rgba(255,106,0,.14);border-radius:16px;padding:13px}
.stat b{font-size:22px;display:block;letter-spacing:-.4px}.stat span{font-size:11px;color:var(--hint);display:block;margin-top:3px}
.listing{position:relative;overflow:hidden;padding-left:16px}
.listing:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--accent),#ff9b45);box-shadow:0 0 14px rgba(255,106,0,.35)}
.listing h3{margin:0 38px 6px 0;font-size:18px;letter-spacing:-.3px}.listing .meta,.listing .price,.listing .discount,.listing .actions{margin-left:0}
.meta{color:var(--hint);font-size:12px;line-height:1.5}.price{font-size:24px;font-weight:850;margin:10px 0 8px;letter-spacing:-.6px;color:#ff7614}
.discount{display:inline-block;padding:6px 9px;border-radius:10px;background:rgba(111,220,61,.13);color:var(--good);font-weight:800;font-size:12px}
.actions{display:flex;gap:8px;margin-top:13px}.actions button{flex:1}
.star{position:absolute;right:7px;top:7px;background:rgba(255,255,255,.045)!important;color:var(--text)!important;width:38px!important;height:38px;padding:0!important;border-radius:12px!important;font-size:20px;border:1px solid var(--soft-border)!important}
.btn{border:0;border-radius:13px;padding:12px;background:linear-gradient(135deg,#ff6200,#ff8a00);color:#080808;font-size:14px;font-weight:850;box-shadow:0 8px 22px rgba(255,106,0,.22)}
.btn:active{transform:scale(.985)}.ghost{background:rgba(255,255,255,.045);color:var(--text);box-shadow:none;border:1px solid var(--soft-border)}
label{font-size:12px;color:var(--hint);display:block;margin:0 0 6px 2px;font-weight:650}
select,input{width:100%;border:1px solid var(--soft-border);border-radius:13px;padding:12px;background:#0d0f11;color:var(--text);font-size:14px;outline:none}
select:focus,input:focus{border-color:rgba(255,106,0,.55);box-shadow:0 0 0 3px rgba(255,106,0,.08)}
.field{margin-bottom:12px}
.nav{position:fixed;left:9px;right:9px;bottom:9px;background:rgba(10,12,14,.92);border:1px solid var(--soft-border);border-radius:20px;display:grid;grid-template-columns:repeat(4,1fr);padding:7px;box-shadow:0 14px 40px rgba(0,0,0,.5);z-index:5;backdrop-filter:blur(20px)}
.nav button{background:transparent;color:#747b82;border:0;border-radius:14px;padding:8px 2px;font-size:11px}.nav button.active{background:rgba(255,106,0,.12);color:#ff7918;font-weight:800}
.hidden{display:none}.status{text-align:center;color:var(--hint);padding:10px;font-size:12px}.lang{display:flex;gap:7px}.lang button{flex:1}
.empty{text-align:center;color:var(--hint);padding:30px 8px}.section-title{font-size:16px;font-weight:850;margin:2px 2px 12px}.section-title::first-letter{color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:5px 8px;border-radius:9px;background:rgba(255,106,0,.11);color:#ff8a3d}
</style>
</head>
<body>
<header><h1>🚗 AutoHunter</h1><div class="sub" id="subtitle"></div></header>

<section id="home">
<div class="card"><div class="stats">
<div class="stat"><b id="found">—</b><span id="foundL"></span></div>
<div class="stat"><b id="below">—</b><span id="belowL"></span></div>
<div class="stat"><b id="avg">—</b><span id="avgL"></span></div>
<div class="stat"><b id="max">—</b><span id="maxL"></span></div>
</div></div>
<div class="section-title">🔥 <span id="findsTitle"></span></div><div id="listings"></div>
</section>

<section id="search" class="hidden">
<div class="card">
<div class="field"><label id="brandL"></label><select id="brand"><option value=""></option></select>
<div style="display:flex;gap:7px;margin-top:7px"><input id="brandSearch" placeholder="" style="flex:1"><button class="btn" type="button" onclick="manualSearch('brand')" id="brandSearchBtn" style="white-space:nowrap;padding:10px 12px"></button></div></div>
<div class="field"><label id="modelL"></label><select id="model" disabled><option value=""></option></select>
<div style="display:flex;gap:7px;margin-top:7px"><input id="modelSearch" placeholder="" style="flex:1"><button class="btn" type="button" onclick="manualSearch('model')" id="modelSearchBtn" style="white-space:nowrap;padding:10px 12px"></button></div></div>
<div class="field"><label id="regionL"></label><select id="region"><option value=""></option></select></div>
<div class="field"><label id="yearL"></label><select id="year"><option>2012</option><option>2015</option><option>2018</option><option>2020</option><option>2022</option></select></div>
<div class="field"><label id="discountL"></label><select id="discount"><option>10</option><option>15</option><option>20</option><option>25</option><option>30</option></select></div>
<div class="field"><label id="mileageL"></label><select id="mileage"><option value=""></option><option>100000</option><option>150000</option><option>200000</option><option>250000</option></select></div>
<div class="field"><label id="priceL"></label><select id="price"><option value=""></option><option>10000</option><option>20000</option><option>30000</option><option>50000</option></select></div>
<div class="field"><label id="transmissionL"></label><select id="transmission"><option value=""></option><option value="автомат">Автомат</option><option value="механика">Механика</option></select></div>
<div class="field"><label id="fuelL"></label><select id="fuel"><option value=""></option><option value="бензин">Бензин</option><option value="дизель">Дизель</option><option value="электро">Электро</option><option value="гибрид">Гибрид</option></select></div>
<div class="status" id="status"></div><button class="btn" onclick="save()" id="saveBtn"></button>
</div></section>

<section id="favorites" class="hidden"><div id="favList"></div></section>
<section id="settings" class="hidden">
<div class="card"><b id="langTitle"></b><div class="lang" style="margin-top:10px">
<button class="btn ghost" onclick="setLang('uk')">🇺🇦 Українська</button><button class="btn ghost" onclick="setLang('ru')">🇷🇺 Русский</button><button class="btn ghost" onclick="setLang('en')">🇬🇧 English</button>
</div></div>
<div class="card"><b id="settingsInfo"></b><div class="status" id="settingsStatus"></div></div>
</section>

<nav class="nav">
<button class="active" onclick="showTab('home',this)">🏠<br><span id="navHome"></span></button>
<button onclick="showTab('search',this)">🔎<br><span id="navSearch"></span></button>
<button onclick="showTab('favorites',this)">❤️<br><span id="navFav"></span></button>
<button onclick="showTab('settings',this)">⚙️<br><span id="navSettings"></span></button>
</nav>

<script>
const tg=window.Telegram.WebApp;tg.ready();tg.expand();
const headers={"X-Telegram-Init-Data":tg.initData};
let lang='ru',brands=[],regions=[],modelCatalog=[],settings=null;
const T={
ru:{sub:'Поиск автомобилей ниже рыночной цены',home:'Находки',search:'Поиск',fav:'Избранное',settings:'Настройки',findsTitle:'Свежие находки',found:'Найдено за 24 часа',below:'Ниже рынка',avg:'Средняя скидка',max:'Максимальная скидка',brand:'Марка',model:'Модель',region:'Регион',year:'Минимальный год',discount:'Минимальная скидка от рынка, %',mileage:'Максимальный пробег, км',price:'Максимальная цена, USD',transmission:'Тип КПП',fuel:'Тип топлива',save:'💾 Сохранить фильтры',manualBrand:'Поиск марки вручную',manualModel:'Поиск модели вручную',manualSearchBtn:'Найти',langTitle:'Язык приложения',settingsInfo:'Настройки сохраняются автоматически в вашем аккаунте',saved:'Сохранено ✅',error:'Ошибка',anyBrand:'Любая марка',anyModel:'Любая модель',allRegions:'Вся Украина',noLimit:'Без ограничения',empty:'Объявлений по вашим критериям пока нет. Включен фоновый мониторинг',service:'Сервис временно недоступен, пробуем снова…',open:'Открыть объявление',noMarket:'Рынок: нет данных',today:'сегодня',favEmpty:'Избранных автомобилей пока нет'},
uk:{sub:'Пошук автомобілів нижче ринкової ціни',home:'Знахідки',search:'Пошук',fav:'Обране',settings:'Налаштування',findsTitle:'Свіжі знахідки',found:'Знайдено за 24 години',below:'Нижче ринку',avg:'Середня знижка',max:'Максимальна знижка',brand:'Марка',model:'Модель',region:'Регіон',year:'Мінімальний рік',discount:'Мінімальна знижка від ринку, %',mileage:'Максимальний пробіг, км',price:'Максимальна ціна, USD',transmission:'Тип КПП',fuel:'Тип пального',save:'💾 Зберегти фільтри',manualBrand:'Пошук марки вручну',manualModel:'Пошук моделі вручну',manualSearchBtn:'Знайти',langTitle:'Мова застосунку',settingsInfo:'Налаштування зберігаються автоматично у вашому акаунті',saved:'Збережено ✅',error:'Помилка',anyBrand:'Будь-яка марка',anyModel:'Будь-яка модель',allRegions:'Вся Україна',noLimit:'Без обмежень',empty:'Оголошень за вашими критеріями поки немає. Увімкнено фоновий моніторинг',service:'Сервіс тимчасово недоступний, пробуємо знову…',open:'Відкрити оголошення',noMarket:'Ринок: немає даних',today:'сьогодні',favEmpty:'Обраних автомобілів поки немає'},
en:{sub:'Find cars below market price',home:'Finds',search:'Search',fav:'Favorites',settings:'Settings',findsTitle:'Fresh finds',found:'Found in 24h',below:'Below market',avg:'Average discount',max:'Max discount',brand:'Make',model:'Model',region:'Region',year:'Minimum year',discount:'Minimum market discount, %',mileage:'Maximum mileage, km',price:'Maximum price, USD',transmission:'Transmission',fuel:'Fuel type',save:'💾 Save filters',manualBrand:'Search make manually',manualModel:'Search model manually',manualSearchBtn:'Search',langTitle:'App language',settingsInfo:'Settings are saved automatically to your account',saved:'Saved ✅',error:'Error',anyBrand:'Any make',anyModel:'Any model',allRegions:'All Ukraine',noLimit:'No limit',empty:'No listings match your criteria yet. Background monitoring is enabled',service:'Service temporarily unavailable, trying again…',open:'Open listing',noMarket:'Market: no data',today:'today',favEmpty:'No favorite cars yet'}
};
function tr(k){return T[lang][k]||k}
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...headers,...(opt.headers||{}),'Content-Type':'application/json'}});if(!r.ok)throw Error(await r.text());return r.json()}
function applyText(){document.getElementById('subtitle').textContent=tr('sub');document.getElementById('findsTitle').textContent=tr('findsTitle');['navHome','navSearch','navFav','navSettings'].forEach((id,i)=>document.getElementById(id).textContent=[tr('home'),tr('search'),tr('fav'),tr('settings')][i]);document.getElementById('foundL').textContent=tr('found');document.getElementById('belowL').textContent=tr('below');document.getElementById('avgL').textContent=tr('avg');document.getElementById('maxL').textContent=tr('max');document.getElementById('brandL').textContent=tr('brand');document.getElementById('modelL').textContent=tr('model');document.getElementById('regionL').textContent=tr('region');document.getElementById('yearL').textContent=tr('year');document.getElementById('discountL').textContent=tr('discount');document.getElementById('mileageL').textContent=tr('mileage');document.getElementById('priceL').textContent=tr('price');document.getElementById('transmissionL').textContent=tr('transmission');document.getElementById('fuelL').textContent=tr('fuel');document.getElementById('saveBtn').textContent=tr('save');document.getElementById('brandSearchBtn').textContent=tr('manualBrand');document.getElementById('modelSearchBtn').textContent=tr('manualModel');document.getElementById('brandSearch').placeholder=tr('manualBrand');document.getElementById('modelSearch').placeholder=tr('manualModel');document.getElementById('langTitle').textContent=tr('langTitle');document.getElementById('settingsInfo').textContent=tr('settingsInfo');document.querySelector('#brand option').textContent=tr('anyBrand');document.querySelector('#model option').textContent=tr('anyModel');document.querySelector('#region option').textContent=tr('allRegions');document.querySelector('#mileage option').textContent=tr('noLimit');document.querySelector('#price option').textContent=tr('noLimit')}
function showTab(id,btn){['home','search','favorites','settings'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');if(id==='home')loadHome();if(id==='favorites')loadFavorites()}
function money(v){return v==null?'—':'$'+Math.round(v).toLocaleString('en-US')}
function renderListings(items,target){const el=document.getElementById(target);if(!items.length){el.innerHTML='<div class="card empty">'+tr(target==='favList'?'favEmpty':'empty')+'</div>';return}el.innerHTML=items.map(x=>{const title=[x.brand,x.model].filter(Boolean).join(' ')||x.title||'Auto';const d=x.discount_percent!=null?'<span class="discount">−'+Math.abs(Number(x.discount_percent)).toFixed(1)+'%</span>':'<span class="meta">'+tr('noMarket')+'</span>';return '<div class="card listing"><button class="star" onclick="fav(\''+x.source+'\',\''+x.source_id+'\','+(!x.is_favorite)+')">'+(x.is_favorite?'❤️':'♡')+'</button><h3>'+esc(title)+'</h3><div class="meta">'+(x.year||'—')+' · '+(x.mileage_km?Number(x.mileage_km).toLocaleString()+' km':'—')+' · '+(x.city||'—')+'</div><div class="price">'+money(x.price_usd)+'</div>'+d+'<div class="actions"><button class="btn" onclick="window.open(\''+x.url+'\',\'_blank\')">'+tr('open')+'</button></div></div>'}).join('')}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function loadHome(){try{const [items,s]=await Promise.all([api('/api/listings'),api('/api/stats')]);renderListings(items,'listings');document.getElementById('found').textContent=s.found_today||0;document.getElementById('below').textContent=s.below_market_today||0;document.getElementById('avg').textContent=s.avg_discount==null?'—':Number(s.avg_discount).toFixed(1)+'%';document.getElementById('max').textContent=s.max_discount==null?'—':Number(s.max_discount).toFixed(1)+'%'}catch(e){document.getElementById('listings').innerHTML='<div class="card empty">'+tr('service')+'</div>'}}
async function loadFavorites(){try{renderListings(await api('/api/favorites'),'favList')}catch(e){document.getElementById('favList').innerHTML='<div class="card empty">'+tr('service')+'</div>'}}
async function fav(source,id,value){await api('/api/favorites',{method:'POST',body:JSON.stringify({source,source_id:id,value})});loadHome();loadFavorites()}
async function loadCatalogs(){
  const results=await Promise.allSettled([api('/api/catalog/brands'),api('/api/catalog/regions')]);
  brands=results[0].status==='fulfilled'&&Array.isArray(results[0].value)?results[0].value:[];
  regions=results[1].status==='fulfilled'&&Array.isArray(results[1].value)?results[1].value:[];
  const b=document.getElementById('brand');
  b.innerHTML='<option value="">'+tr('anyBrand')+'</option>';
  brands.forEach(x=>b.add(new Option(x.name,x.id)));
  const r=document.getElementById('region');
  r.innerHTML='<option value="">'+tr('allRegions')+'</option>';
  regions.forEach(x=>r.add(new Option(x.name,x.id)));
  b.onchange=()=>{settings=settings||{};settings.brand_id=Number(b.value)||null;settings.model_id=null;document.getElementById('modelSearch').value='';loadModels();};
  document.getElementById('model').onchange=()=>{settings=settings||{};settings.model_id=Number(document.getElementById('model').value)||null;};
  if(settings?.brand_id){
    b.value=String(settings.brand_id);
    await loadModels();
  }
  if(settings) applySettingsValues(settings);
}
async function loadModels(){
  const id=document.getElementById('brand').value,m=document.getElementById('model');
  if(id){settings=settings||{};settings.brand_id=Number(id);}
  m.innerHTML='<option value="">'+tr('anyModel')+'</option>';
  m.disabled=!id;
  if(id){
    modelCatalog=await api('/api/catalog/brands/'+id+'/models');
    modelCatalog.forEach(x=>m.add(new Option(x.name,x.id)));
  }else{
    modelCatalog=[];
  }
  if(settings?.model_id) m.value=String(settings.model_id);
  else m.value='';
}
function applySettingsValues(s){
  document.getElementById('brand').value=s.brand_id?String(s.brand_id):'';
  document.getElementById('region').value=s.region_id?String(s.region_id):'';
  document.getElementById('model').value=s.model_id?String(s.model_id):'';
  document.getElementById('year').value=s.min_year;
  document.getElementById('discount').value=s.min_discount;
  document.getElementById('mileage').value=s.max_mileage_km||'';
  document.getElementById('price').value=s.max_price_usd||'';
  document.getElementById('transmission').value=s.transmission||'';
  document.getElementById('fuel').value=s.fuel||'';
}
function applySettings(s){settings=s;applySettingsValues(s)}
function manualSearch(kind){
  const input=document.getElementById(kind+'Search');
  const q=(input.value||'').trim().toLowerCase();
  if(kind==='brand'){
    const list=q?brands.filter(x=>String(x.name||'').toLowerCase().includes(q)):brands;
    const b=document.getElementById('brand');
    b.innerHTML='<option value="">'+tr('anyBrand')+'</option>';
    list.forEach(x=>b.add(new Option(x.name,x.id)));
    if(list.length===1){
      b.value=String(list[0].id);
      settings=settings||{};
      settings.brand_id=Number(list[0].id);
      settings.model_id=null;
      loadModels();
    }else{
      b.value='';
      document.getElementById('model').innerHTML='<option value="">'+tr('anyModel')+'</option>';
      document.getElementById('model').disabled=true;
    }
  }else{
    const id=document.getElementById('brand').value;
    if(!id)return;
    const list=q?modelCatalog.filter(x=>String(x.name||'').toLowerCase().includes(q)):modelCatalog;
    const m=document.getElementById('model');
    m.innerHTML='<option value="">'+tr('anyModel')+'</option>';
    list.forEach(x=>m.add(new Option(x.name,x.id)));
    m.disabled=false;
    if(list.length===1){m.value=String(list[0].id);settings=settings||{};settings.model_id=Number(list[0].id);}
  }
}
document.getElementById('brandSearch').addEventListener('keydown',e=>{if(e.key==='Enter')manualSearch('brand')});
document.getElementById('modelSearch').addEventListener('keydown',e=>{if(e.key==='Enter')manualSearch('model')});

async function save(){try{document.getElementById('status').textContent='…';const bid=Number(document.getElementById('brand').value)||null,mid=Number(document.getElementById('model').value)||null,rid=Number(document.getElementById('region').value)||null;const bo=brands.find(x=>x.id===bid),mo=[...document.getElementById('model').options].find(x=>Number(x.value)===mid),ro=regions.find(x=>x.id===rid);applySettings(await api('/api/settings',{method:'POST',body:JSON.stringify({min_year:Number(document.getElementById('year').value),min_discount:Number(document.getElementById('discount').value),max_mileage_km:document.getElementById('mileage').value?Number(document.getElementById('mileage').value):null,max_price_usd:document.getElementById('price').value?Number(document.getElementById('price').value):null,transmission:document.getElementById('transmission').value||null,fuel:document.getElementById('fuel').value||null,brand_id:bid,brand_name:bo?.name||null,model_id:mid,model_name:mo?.text||null,region_id:rid,region_name:ro?.name||null})}));document.getElementById('status').textContent=tr('saved')}catch(e){document.getElementById('status').textContent=tr('service')}}
async function setLang(l){lang=l;await api('/api/language',{method:'POST',body:JSON.stringify({language:l})});applyText();document.getElementById('settingsStatus').textContent=tr('saved');loadHome()}
(async()=>{try{if(!tg.initData)throw Error();lang=(await api('/api/language')).language||'ru';applyText();const me=await api('/api/me');settings=me;await loadHome();try{await loadCatalogs();applySettingsValues(me)}catch(e){console.warn('Catalog loading failed:',e);document.getElementById('status').textContent=tr('error')} }catch(e){console.error('Mini App startup error:',e);document.body.innerHTML='<div class="card empty"><b>'+tr('error')+'</b><br><small>'+esc(e?.message||String(e))+'</small></div>'}})();
</script>
</body></html>
